version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: patient_monitoring_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_monitoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - patient_monitoring_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: patient_monitoring_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.ru
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  patient_monitoring_pgdata: